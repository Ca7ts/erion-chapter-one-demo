<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>厄里昂・存檔備份檢查</title>
<style>body{margin:24px auto;max-width:1000px;padding:0 18px;background:#10171b;color:#eadcc2;font:16px/1.6 system-ui}h1{color:#dfbf73}article{border:1px solid #8d7549;padding:16px;margin:18px 0;background:#1a2024}summary{cursor:pointer;color:#ecd69c}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#ccd9df}button,a{color:#ead19a;background:#292824;border:1px solid #aa8b4c;padding:10px 18px;text-decoration:none}table{width:100%;text-align:left}td,th{padding:6px;border-bottom:1px solid #403d33}</style>
<h1>存檔備份檢查</h1><p>此頁只讀取這個瀏覽器內的遊戲備份，不會變更、合併或重設進度。資料不會上傳。</p><button id="export">下載原始備份</button> <a href="../?area=coast">返回第一章</a><main id="saves"></main>
<script>
const keys=['erion-region-adventure-v1','erion-sea-chapter-v1','erion-character-v1','erion-chapter-continuity-backup-v1','erion-continuity-r30-before-save','erion-continuity-r30-before-repair','erion-continuity-r30-repair','erion-region-adventure-v1-before-shared-character','erion-sea-chapter-v1-before-shared-character'];
const raw=Object.fromEntries(keys.map(k=>[k,localStorage.getItem(k)])),read=k=>{try{return JSON.parse(raw[k]||'null')}catch{return null}};
const first=read(keys[0]),sea=read(keys[1]),legacy=read(keys[2]),cross=read(keys[3]),r30=read(keys[4]),r30repair=read(keys[5]);
const records=[['目前第一章',first],['第二章匯入物品',sea?.rpg&&{...sea.rpg,items:sea.rpg.inventory}],['舊版共享物品',legacy],['首次跨章前第一章備份',cross?.first],['首次跨章前共享備份',cross?.shared],['本次修復前第一章備份',r30?.first],['自動恢復前備份',r30repair?.first],['共享機制啟用前第一章備份',read(keys[7])],['共享機制啟用前第二章備份',read(keys[8])]];
for(const [name,s]of records){const box=document.createElement('article'),h=document.createElement('h2');h.textContent=name;box.append(h);if(!s){box.append('未找到此備份');document.querySelector('main').append(box);continue;}
const items=s.items||s.inventory||{},nonzero=Object.entries(items).filter(([,v])=>Number(v)>0),p=document.createElement('p');p.textContent=`物品種類 ${nonzero.length}；物品總數 ${nonzero.reduce((n,[,v])=>n+Number(v),0)}；經驗 ${s.growth?.xp??'未記錄'}；金錢 ${s.economy?.balance??'未記錄'}；裝備件數 ${s.loot?.items?.length??'未記錄'}；主線節點 ${s.step??'未記錄'}；交接版本 ${s.continuityVersion??'舊版'}`;box.append(p);
const detail=document.createElement('details');detail.open=true;const summary=document.createElement('summary');summary.textContent='物品數量與備份識別';const pre=document.createElement('pre');pre.textContent=JSON.stringify({items,flags:s.flags,hp:s.hp,maxHp:s.maxHp,inventoryMatchesFirst:JSON.stringify(items)===JSON.stringify(first?.items)},null,2);detail.append(summary,pre);box.append(detail);document.querySelector('main').append(box);}
document.querySelector('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),saves:raw},null,2)],{type:'application/json'}));a.href=url;a.download='erion-save-backups.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
